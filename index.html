<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バスク31 PL賭けノート 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#37003C; --purple-2:#5C2B62; --grey:#6B5B6E;
  --line:#E9E2EC; --panel:#F7F4F8;
  --pink:#E90052; --green:#00B96B; --green-lt:#00FF87; --cyan:#04F5FF;
  --disp:'Poppins'; --body:'Poppins';
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body),'Noto Sans JP',sans-serif;background:#fff;color:var(--purple);padding-bottom:70px}
.wrap{max-width:560px;margin:0 auto}
button{font-family:var(--body),'Noto Sans JP',sans-serif}
input,select{font-family:var(--body),'Noto Sans JP',sans-serif}

/* ── app bar ── */
.appbar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
.mark{width:50px;height:50px;flex:none;display:grid;place-items:center}
.mark img{width:50px;height:50px;object-fit:contain}
.mark svg{width:42px;height:42px;fill:var(--purple)}
.brand{min-width:0}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:16.5px;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.brand i{display:block;font-style:normal;font-family:var(--disp);font-size:10px;font-weight:700;
  color:var(--grey);letter-spacing:.08em;margin-top:3px}
.appbar .sp{flex:1;min-width:4px}
.crew{font-family:'Dela Gothic One',var(--disp),'Noto Sans JP',sans-serif;font-size:11.5px;
  color:var(--green-lt);background:linear-gradient(100deg,#37003C,#6A2F72);
  padding:6px 11px;border-radius:20px;white-space:nowrap;flex:none;letter-spacing:.01em}
.chip-me{display:grid;place-items:center;width:32px;height:32px;padding:0;flex:none;
  border-radius:50%;background:var(--panel);border:none;cursor:pointer}
.chip-me.none{width:auto;height:auto;padding:7px 12px;border-radius:20px;
  font-size:11px;font-weight:700;color:var(--purple)}
.appbar .sp{flex:1}
.season{display:none}

/* ── メンバーアイコン（丸写真＋注目クラブのエンブレム） ── */
.av{position:relative;display:inline-flex;flex:none;align-items:center;justify-content:center;
  border-radius:50%;background:var(--panel);overflow:visible}
.av-i{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av-t{font-family:var(--disp);font-weight:800;color:var(--grey);line-height:1}
.av-b{position:absolute;right:-2px;bottom:-2px;line-height:0;background:#fff;border-radius:50%;padding:1px;
  box-shadow:0 0 0 1px #fff}
.av-b .crest{display:block;width:100%;height:100%}
/* アイコンを大きく見るやつ */
.avbig{display:grid;place-items:center;gap:12px}
.avbig .ph{width:200px;height:200px;border-radius:50%;object-fit:cover;background:var(--panel);display:block}
.avbig .ph-t{width:200px;height:200px;border-radius:50%;background:var(--panel);display:grid;place-items:center;
  font-family:var(--disp);font-size:84px;font-weight:800;color:var(--grey)}
.avbig .who{font-size:16px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:7px}
.hero .mw{display:flex;align-items:baseline;gap:9px;margin-top:3px}
.hero .mw b{font-family:var(--disp);font-size:54px;font-weight:800;letter-spacing:-.045em;line-height:.86}
.hero .mw i{font-style:normal;font-family:var(--disp);font-size:19px;font-weight:700;
  opacity:.5;letter-spacing:-.02em}

/* ── 開幕カウントダウン（開幕までの間だけ出る） ── */
.cdnum{display:flex;align-items:baseline;gap:4px;margin-top:4px;flex-wrap:wrap}
.cdnum b{font-family:var(--disp);font-size:50px;font-weight:800;letter-spacing:-.045em;line-height:.9}
.cdnum i{font-style:normal;font-size:15px;font-weight:700;opacity:.8;margin-right:8px}
.cdko{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.08em;margin-top:8px;opacity:.9}
.cdtodo{margin-top:11px;background:rgba(255,255,255,.17);border-radius:10px;padding:9px 11px;
  font-size:11.5px;font-weight:700;line-height:1.65}
.cdtodo b{font-family:var(--disp);font-size:13px}
.cdtodo .yet{display:block;margin-top:3px;opacity:.92}

/* ── テーマ曲プレイヤー ── */
.thbox{margin:0 12px 10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.thbtn{width:100%;padding:13px 0;border:none;border-radius:10px;background:var(--purple);color:#fff;
  font-weight:800;font-size:13px;cursor:pointer}
.thbtn.on{background:var(--pink)}
.thbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.thbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#00FF87,#04F5FF);border-radius:3px}
.thmeta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:10.5px;
  font-weight:600;color:var(--grey)}
.thmeta a{color:var(--grey)}
.ytwrap{margin:0 12px 10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.ytwrap iframe{width:100%;height:100%;border:0;display:block}

/* ── league table mode switch ── */
.seg{display:flex;margin:0 12px 10px;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;font-size:12px;font-weight:700;padding:8px 2px;border:none;border-radius:8px;background:none;color:var(--grey);cursor:pointer}
.seg button.on{background:#fff;color:var(--purple);box-shadow:0 1px 3px rgba(55,0,60,.12)}
.tblscroll{margin:0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblscroll .tbl{margin:0;min-width:342px}
.frm{display:flex;gap:4px;justify-content:flex-end}
.frm span{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-size:9px;font-weight:800;color:#fff}
.frm .W{background:var(--green)} .frm .D{background:#9A8FA0} .frm .L{background:var(--pink)}
.frm .none{background:var(--line);color:var(--grey)}

/* ── hero ── */
.hero{background:linear-gradient(100deg,#8F00FF 0%,#4B5BFF 42%,#04F5FF 100%);padding:22px 18px 26px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 26px)}
.hero .in{position:relative;z-index:2}
.hero .eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;opacity:.85;margin-bottom:4px}
.hero h1{font-family:var(--disp);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero .sub{font-size:11.5px;font-weight:600;opacity:.9;margin-top:6px}
.hero-g{position:relative;overflow:hidden;padding:22px 18px 26px;color:var(--purple);background:linear-gradient(100deg,#C8FF00 0%,#00FF87 52%,#00E4C4 100%)}
.hero-g .chev{position:absolute;top:-30%;height:160%;width:52%;background:rgba(255,255,255,.16);transform:skewX(-22deg)}
.hero-g .chev.c1{left:-16%} .hero-g .chev.c2{left:24%;background:rgba(255,255,255,.09)} .hero-g .chev.c3{left:66%;background:rgba(255,255,255,.13)}
.hero-g .in{position:relative;z-index:2}
.hero-g .eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;opacity:.72;margin-bottom:4px}
.hero-g h1{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero-g .sub{font-size:11.5px;font-weight:700;opacity:.78;margin-top:6px}

/* ── tabs ── */
.tabs{display:flex;background:var(--purple);padding:0 6px;position:sticky;top:72px;z-index:29}
.tabs button{flex:1;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);background:none;border:none;padding:13px 1px 11px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--green-lt)}

/* ── matchweek bar ── */
.mwbar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.mwbar .arw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--purple);font-size:14px;font-weight:700;cursor:pointer;flex:none}
.mwbar .arw:disabled{opacity:.25}
.mwbar .now{flex:1;text-align:center}
.mwbar .now b{display:block;font-family:var(--disp);font-weight:700;font-size:14px}
.mwbar .now i{display:block;font-style:normal;font-size:10px;color:var(--grey);font-weight:500;margin-top:1px}

.sec{padding:16px 14px 4px}
.sec h2{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec p{font-size:11.5px;color:var(--grey);font-weight:500;margin-top:3px;line-height:1.6}
.daterow{font-family:var(--disp);font-size:13.5px;font-weight:700;padding:14px 15px 7px}
.divider{height:8px;background:var(--panel);margin-top:18px}
.empty{margin:0 12px;text-align:center;color:var(--grey);font-size:12.5px;padding:26px 12px;border:1px dashed var(--line);border-radius:12px;line-height:1.6}
.loading{text-align:center;padding:60px 0;color:var(--grey);font-size:13px}

/* ── fixture card ── */
.fx{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 12px 8px;overflow:hidden}
.fxrow{display:grid;grid-template-columns:1fr 26px auto 26px 1fr;align-items:center;gap:8px;padding:13px 11px}
.fxrow .tn{font-size:12px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fxrow .tn.h{text-align:right}
.fxrow .ko{font-family:var(--disp);font-size:14.5px;font-weight:700;text-align:center}
.crest{width:26px;height:26px;display:block;object-fit:contain}
.fxfoot{border-top:1px solid var(--line);padding:8px 11px;display:flex;align-items:center;gap:8px;background:#FCFBFD;flex-wrap:wrap}
.nombtn{font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:20px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);cursor:pointer}
.nomtag{font-size:11px;font-weight:700;color:var(--grey)}
.nomtag b{color:var(--purple)}
.mini{font-size:10.5px;color:var(--grey);font-weight:600}

/* ── bet ticket ── */
.tk{border:1px solid var(--line);border-radius:14px;margin:0 12px 12px;overflow:hidden}
.tk-top{background:var(--purple);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tk-top .who{font-size:11px;font-weight:700}
.tk-top .who b{color:var(--green-lt)}
.tk .cond{margin:2px 11px 8px;font-size:11px;font-weight:700;color:var(--purple);
  background:var(--panel);border-left:3px solid var(--pink);border-radius:0 7px 7px 0;padding:7px 10px;line-height:1.5}
.dsel{width:100%;padding:11px 12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:9px;
  font-size:13px;font-weight:700;color:var(--purple);background:#fff;-webkit-appearance:none;appearance:none}
.bprev{background:var(--panel);border-radius:9px;padding:9px 11px;margin-bottom:12px}
.bp-cond{font-size:11.5px;font-weight:800;color:var(--purple);margin-bottom:5px}
.bp-opts{display:flex;flex-direction:column;gap:3px}
.bp-opts span{font-size:11px;font-weight:600;color:var(--grey)}
.tk-top .rate{font-family:var(--disp);font-size:10px;font-weight:800;background:var(--green-lt);color:var(--purple);padding:3px 9px;border-radius:20px;letter-spacing:-.01em}
.tk-top .sp{flex:1}
.tk-top .dl{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px}
.tk-top .dl.shut{background:var(--pink)}
.picks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:2px 11px 11px}
.pk{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 3px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pk .crest{width:24px;height:24px}
.pk em{font-style:normal;font-size:10px;font-weight:700;color:var(--grey)}
.pk .pct{font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--purple)}
.pk.sel{border-color:var(--purple);background:var(--purple);box-shadow:0 3px 0 rgba(55,0,60,.15)}
.pk.sel em{color:#fff} .pk.sel .pct{color:var(--green-lt)}
.pk.dim{opacity:.42}
.pk .dm{width:24px;height:24px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--grey)}
.pk .dm.txt{font-size:9px;letter-spacing:.06em}
.pk.sel .dm{color:#fff}
.nomctl{font-size:10.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:none;border-radius:14px;padding:4px 11px;cursor:pointer}
.ovlog{margin:9px 11px 0;background:#FDE9F0;border-radius:9px;padding:8px 11px;font-size:10.5px;font-weight:600;color:#B00040;line-height:1.65}
.ovlog b{font-weight:800}
.favc{width:16px;height:16px;flex:none;vertical-align:-3px}
.plgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px;max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.pbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left;min-width:0}
.pbtn .crest{width:18px;height:18px;flex:none}
.pbtn em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--purple);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn.on{border-color:var(--purple);background:var(--panel)}

/* ── 提出済みの中身を大きく見せるカード ── */
.done-card{margin-top:9px;border:1.5px solid var(--purple);border-radius:11px;overflow:hidden}
.done-h{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--panel);
  font-size:11px;font-weight:800;color:var(--purple)}
.done-h .sp{flex:1}
.done-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--line)}
.done-row .ord{width:19px;height:19px;flex:none;border-radius:50%;background:var(--purple);color:#fff;
  font-family:var(--disp);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.done-row .nm{flex:1;font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.done-row.hit{background:#EAFBF2}
.done-row.hit .nm{color:#0A7B47}
.done-row.miss{opacity:.42}
.done-row .mk{font-size:12px;font-weight:800}
.done-row .mk.o{color:#0A7B47}
.sbtn.ghost2{background:#fff;color:var(--purple);border:1.5px solid var(--line);margin-top:8px}

/* ── 締切後の全員公開 ── */
.rv{border:1px solid var(--line);border-radius:11px;margin-top:9px;overflow:hidden}
.rv-p{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel);
  font-size:12.5px;font-weight:800;color:var(--purple);border-top:1px solid var(--line)}
.rv:first-child .rv-p,.rv .rv-p:first-child{border-top:none}
.rv-p .sp{flex:1}
.rv-p .res{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px}
.rv-p .res.o{background:#D8F6E6;color:#0A7B47}
.rv-p .res.x{background:var(--panel2,#F2F2F5);color:var(--grey)}
.rv-list{display:flex;flex-wrap:wrap;gap:5px;padding:9px 11px}
.rv-item{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;
  padding:5px 8px;font-size:11.5px;font-weight:700;background:#fff}
.rv-item .ord{font-family:var(--disp);font-size:10px;font-weight:800;color:var(--grey)}
.rv-item.hit{border-color:#0A7B47;background:#EAFBF2;color:#0A7B47}
.rv-item.hit .ord{color:#0A7B47}
.rv-item.miss{opacity:.4}
.rv-none{padding:9px 11px;font-size:12px;color:var(--grey);font-weight:600}
.rv-actual{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--panel);
  font-size:12px;font-weight:700;color:var(--purple);line-height:1.7}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 13px;border-top:1px solid var(--line);font-size:12px}
.vrow .nm{flex:1;font-weight:700}
.vrow .val{font-size:11px;font-weight:700;color:var(--grey)}
.vrow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.vrow .dot.no{background:#D9CFDD}
.vrow .mk{width:18px;text-align:center;font-weight:800;font-size:13px}
.mk.win{color:var(--green)} .mk.lose{color:var(--pink)}
.vrow .ovr{font-size:9.5px;font-weight:700;color:var(--pink);background:#FDE9F0;border:none;border-radius:12px;padding:3px 8px;cursor:pointer}
.blind{margin:9px 11px 0;font-size:11.5px;font-weight:600;color:var(--purple-2);background:var(--panel);border-radius:9px;padding:9px 11px;line-height:1.5}
.meter{margin:9px 11px 0}
.meter .bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}
.meter .bar span{display:block;height:100%}
.meter .lbl{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--grey)}
.settled{margin:9px 11px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score{font-family:var(--disp);font-size:13px;font-weight:800;background:var(--purple);color:#fff;padding:5px 12px;border-radius:6px}
.score.void{background:var(--grey)}
.moneyline{margin:8px 11px 0;font-size:11.5px;font-weight:600;color:var(--grey);line-height:1.7}
.moneyline b{color:var(--purple)}
.scin{margin:9px 11px 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.scin input{width:50px;padding:8px 0;text-align:center;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-weight:800;color:var(--purple)}
.scin .dash{font-weight:800;color:var(--grey)}
.scin .go{font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:20px;border:1.5px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer}

/* ── league table ── */
.tbl{margin:0 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.th,.tr{display:grid;align-items:center;gap:5px;padding:8px 10px}
.m-short .th,.m-short .tr{grid-template-columns:28px 1fr 24px 24px 30px 28px}
.m-full .th,.m-full .tr{grid-template-columns:26px minmax(86px,1fr) 22px 22px 22px 22px 26px 26px 28px 26px}
.m-form .th,.m-form .tr{grid-template-columns:28px 1fr auto}
.th{font-size:9px;font-weight:700;color:var(--grey);letter-spacing:.05em;border-bottom:1px solid var(--line);background:#FCFBFD}
.tr{border-bottom:1px solid var(--line);font-size:11.5px;position:relative}
.tr:last-child{border-bottom:none}
.tr .pos{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--grey);text-align:center}
.tr .tm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700}
.tr .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .crest{width:18px;height:18px;flex:none}
.tr .n{text-align:center;color:var(--grey);font-variant-numeric:tabular-nums}
.tr .pts{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.tr.ucl::before{background:var(--green-lt)}
.tr.rel::before{background:var(--pink)}
.legend{display:flex;gap:14px;padding:9px 14px 0;font-size:10px;color:var(--grey);font-weight:600}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* ── score grid ── */
.sg{margin:0 12px 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sgrow{display:grid;grid-template-columns:1fr 20px 42px 10px 42px 20px 1fr;align-items:center;gap:5px;padding:9px 9px;border-bottom:1px solid var(--line)}
.sgrow:last-child{border-bottom:none}
.sgrow .tn{font-size:10.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sgrow .tn.h{text-align:right}
.sgrow .crest{width:20px;height:20px}
.sgrow input{width:100%;padding:7px 0;text-align:center;border:1.5px solid var(--line);border-radius:7px;font-size:14px;font-weight:800;color:var(--purple)}
.sgrow .dash{text-align:center;font-weight:800;color:var(--grey);font-size:11px}
.sgrow.done input{border-color:#CFE9DA;background:#F3FBF6}

.mrow:last-child{border-bottom:none}
.mrow .rk{font-family:var(--disp);font-size:17px;font-weight:700;width:20px;color:var(--grey)}
.mrow:first-child .rk{color:var(--purple)}
.mrow .nm{flex:1;font-weight:700;font-size:13px}
.mrow .rec{font-size:10.5px;color:var(--grey);font-weight:600}
.mrow .amt{font-family:var(--disp);font-size:16px;font-weight:700;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.amt.up{color:var(--green)} .amt.dn{color:var(--pink)} .amt.ze{color:var(--grey)}
.txrow{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
.txrow:last-child{border-bottom:none}
.txrow .ar{color:var(--pink);font-weight:800}
.txrow .am{margin-left:auto;font-family:var(--disp);font-size:14px;font-weight:800}

.strow .rk{font-family:var(--disp);width:14px;color:var(--grey);font-weight:700}
.strow .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .sub{font-size:10px;color:var(--grey);font-weight:600}
.strow .big{font-family:var(--disp);font-size:16px;font-weight:700;min-width:42px;text-align:right}
.badge-s{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:12px;white-space:nowrap}
.badge-s.g{background:#E7F9F0;color:#00713F}
.badge-s.r{background:#FDE9F0;color:#B00040}
.mvp{margin:0 12px 8px;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,#DFFF66,#00FF87 78%);color:var(--purple)}

.mvp .nm{flex:1;font-weight:800;font-size:14px;min-width:0}
.mvp .amt{font-family:var(--disp);font-size:16px;font-weight:800}
.mvp.none{background:var(--panel);color:var(--grey)}
.mvp.none .tag{background:var(--grey);color:#fff}

.side-h{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.side-h b{font-family:var(--disp);font-size:12.5px;font-weight:700;flex:1}
.stake{font-size:9.5px;font-weight:800;color:#fff;background:var(--pink);padding:3px 9px;border-radius:20px}

.pickline{display:flex;align-items:center;gap:7px;padding:4px 0;color:var(--purple);font-weight:700;font-size:12px}

.pickline .ord{font-family:var(--disp);font-weight:800;width:14px;color:var(--grey)}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-top:9px}
.cbtn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}

.crown-body b{color:var(--purple)}

.fold>summary::before{content:'▸';color:var(--pink);font-size:11px}
.fold[open]>summary::before{content:'▾'}

.fold-in b{color:var(--purple)}

.ov{position:fixed;inset:0;background:rgba(30,0,35,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.dlg{background:#fff;border-radius:14px;padding:18px 16px;max-width:330px;width:100%;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.dlg p{font-size:13.5px;font-weight:700;line-height:1.6;margin-bottom:14px;white-space:pre-line}

.dlg-no{background:#fff;border:1.5px solid var(--line)!important;color:var(--grey)}

/* ══════ ダイアログ ══════ */
function ask(msg){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg"><p>${esc(msg)}</p><div class="dlg-btns">
      <button class="dlg-no">やめる</button><button class="dlg-yes">OK</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('.dlg-yes').onclick=()=>{ov.remove();res(true)};
    ov.querySelector('.dlg-no').onclick=()=>{ov.remove();res(false)};
    ov.onclick=e=>{ if(e.target===ov){ov.remove();res(false)} };
  });
}
function askPin(title,sub){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg"><p>${esc(title)}</p><div class="sub">${esc(sub||'')}</div>
      <input class="pin-in" type="password" inputmode="numeric" maxlength="8" placeholder="4〜8桁">
      <div class="dlg-btns"><button class="dlg-no">やめる</button><button class="dlg-yes">OK</button></div></div>`;
    document.body.appendChild(ov);
    const i=ov.querySelector('.pin-in'); setTimeout(()=>i.focus(),60);
    const done=v=>{ov.remove();res(v)};
    ov.querySelector('.dlg-yes').onclick=()=>done(i.value.trim());
    ov.querySelector('.dlg-no').onclick=()=>done(null);
    i.addEventListener('keydown',e=>{ if(e.key==='Enter') done(i.value.trim()) });
    ov.onclick=e=>{ if(e.target===ov) done(null) };
  });
}
function pickWho(){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg"><p>あんた誰や？</p>
      <div class="who-chips">${PLAYERS.map(p=>`<button class="who-chip" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
      <div class="dlg-btns"><button class="dlg-no">やめる</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ov.remove();res(b.dataset.p)});
    ov.querySelector('.dlg-no').onclick=()=>{ov.remove();res(null)};
    ov.onclick=e=>{ if(e.target===ov){ov.remove();res(null)} };
  });
}

/* ══════ PIN本人確認 ══════ */
async function sha(t){
  const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ROOT+':'+t));
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const getIds = () => { try{ return JSON.parse(localStorage.getItem(ROOT+'-ids')||'{}') }catch(e){ return {} } };
const setId = (p,h) => { const m=getIds(); m[p]=h; localStorage.setItem(ROOT+'-ids',JSON.stringify(m)); };
async function verify(p){
  const stored = (state.pins||{})[p];
  if(!stored){
    const pin = await askPin(`${p} のPINを新規設定`,'これ以降この行を触るのに必要。覚えときや');
    if(pin===null) return false;
    if(!/^\d{4,8}$/.test(pin)){ toast('数字4〜8桁でな'); return false; }
    const h = await sha(pin);
    db.ref(`${ROOT}/pins/${p}`).set(h); setId(p,h);
    toast(`${p} のPINを設定した`); return true;
  }
  if(getIds()[p]===stored) return true;
  const pin = await askPin(`${p} のPINを入力`,'この端末は次から省略される');
  if(pin===null) return false;
  const h = await sha(pin);
  if(h!==stored){ toast('PINがちゃうで🚫'); return false; }
  setId(p,h); return true;
}
function meNow(){
  const ids=getIds(), pins=state.pins||{};
  const v = PLAYERS.filter(p=>pins[p] && ids[p]===pins[p]);
  return v.length===1 ? v[0] : null;
}
async function whoAmI(){
  const m = meNow(); if(m) return m;
  const pick = await pickWho(); if(!pick) return null;
  return (await verify(pick)) ? pick : null;
}
async function verifyAdmin(){
  const stored = state.adminPin || null;
  if(!stored){
    const pin = await askPin(`管理人（${ADMIN}）PINを新規設定`,'投票用とは別の専用PIN');
    if(pin===null) return false;
    if(!/^\d{4,8}$/.test(pin)){ toast('数字4〜8桁でな'); return false; }
    const h = await sha('admin:'+pin);
    db.ref(`${ROOT}/adminPin`).set(h);
    localStorage.setItem(ROOT+'-admin',h); toast('管理人PINを設定した'); return true;
  }
  if(localStorage.getItem(ROOT+'-admin')===stored) return true;
  const pin = await askPin('管理人PINを入力',`${ADMIN} 本人確認`);
  if(pin===null) return false;
  const h = await sha('admin:'+pin);
  if(h!==stored){ toast('管理人PINがちゃうで🚫'); return false; }

/* ══════ 目隠し用の暗号化 ══════
   締切前、Firebaseには意味不明な文字列だけが入る。
   matchKey+名前を認証データに使うので、別の欄にコピペしても復号でけへん。
   ※鍵はこのファイル内にあるので、ソースを読んでJSを書ける人には解ける。
     狙いはFirebaseコンソールやDB直叩きでの覗き見を止めること */
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let _key = null;
async function vaultKey(){
  if(_key) return _key;
  const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(VAULT));
  _key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
  return _key;
}
async function seal(slot, who, val){
  const key = await vaultKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const aad = new TextEncoder().encode(slot+'|'+who);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad}, key, new TextEncoder().encode(val));
  return b64(iv)+'.'+b64(ct);
}
async function unseal(slot, who, blob){
  try{
    const key = await vaultKey();
    const parts = String(blob).split('.');
    if(parts.length!==2) return null;
    const aad = new TextEncoder().encode(slot+'|'+who);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(parts[0]),additionalData:aad}, key, unb64(parts[1]));
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}

/* ══════ アイコン写真 ══════
   端末側で正方形に切って96pxに縮めてJPEG化してから送る。
   でかい写真をそのまま上げることは無い */
function chooseImage(){
  return new Promise(res=>{
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.style.position='fixed'; inp.style.left='-9999px';
    document.body.appendChild(inp);
    let done = false;
    const finish = v => { if(done) return; done=true; inp.remove(); res(v); };
    inp.onchange = () => finish(inp.files && inp.files[0] ? inp.files[0] : null);
    /* キャンセルされたら onchange が飛ばん端末があるので保険 */
    window.addEventListener('focus', ()=>setTimeout(()=>finish(null), 1500), {once:true});
    inp.click();
  });
}
function squareDataURL(file, px){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('ファイル読めへんかった'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error('画像として読めへんかった'));
      img.onload = ()=>{
        try{
          const size = px || ICON_PX;
          const cv = document.createElement('canvas');
          cv.width = size; cv.height = size;
          const g = cv.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0,0,size,size);
          const m = Math.min(img.width, img.height);     /* 短辺で中央を正方形に切る */
          g.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
          let q = 0.8, out = cv.toDataURL('image/jpeg', q);
          while(out.length > ICON_MAX && q > 0.3){ q -= 0.15; out = cv.toDataURL('image/jpeg', q); }
          if(out.length > ICON_MAX) return rej(new Error('圧縮しても大きすぎる'));
          res(out);
        }catch(e){ rej(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ⚠️ chooseImage() は必ずタップ直後に「同期で」呼ぶこと。
   await を1個でも挟んでから呼ぶと、iOSが操作の起点を見失ってピッカーを開かへん。
   やから「先にファイルを選ばせて、本人確認はそのあと」の順にしてある */
function chooseImage(){
  return new Promise(res=>{
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(inp);
    let done = false;
    const finish = v => { if(done) return; done=true; setTimeout(()=>inp.remove(),0); res(v); };
    inp.addEventListener('change', ()=>finish(inp.files && inp.files[0] ? inp.files[0] : null));
    inp.addEventListener('cancel', ()=>finish(null));
    /* 保険：ピッカーから戻って一定時間 change が来んかったら諦める。
       HEICの変換待ちがあるので長めに取ってある */
    window.addEventListener('focus', ()=>{
      setTimeout(()=>{ if(!done && !(inp.files && inp.files.length)) finish(null); }, 10000);
    }, {once:true});
    inp.click();
  });
}

let revealing = false;
async function autoReveal(){
  if(revealing || !state) return;
  revealing = true;
  try{
    const updates = {};
    /* 試合の賭け */
    const enc = state.enc || {}, picks = state.picks || {};
    for(const key of Object.keys(enc)){
      const f = byKey[key]; if(!f || !isLocked(f)) continue;
      for(const who of Object.keys(enc[key]||{})){

        const v = await unseal(key, who, enc[key][who]);
        if(v && validPick(key, v)) updates[`${ROOT}/picks/${key}/${who}`] = v;
      }
      updates[`${ROOT}/enc/${key}`] = null;
    }
    /* 年間予想（開幕キックオフで一斉開示） */

      for(const type of ['champion','top4','relegation','scorer']){
        const e = (se[type]||{}).enc || {}, p = (se[type]||{}).picks || {};
        for(const who of Object.keys(e)){
          if(p[who] != null) continue;
          const v = await unseal('side:'+type, who, e[who]);
          if(v != null){
            try{ updates[`${ROOT}/side/${type}/picks/${who}`] = JSON.parse(v); }catch(x){}
          }

}

/* ══════ 精算 ══════ */
function scoreOf(key){ const s=(state.scores||{})[key]; return (s && s.h!=null && s.a!=null) ? s : null; }

/* ── 賭けの種類 ──
   3way : ホーム勝ち / ドロー / アウェイ勝ち
   hc   : ハンデ付き2択。condTeam が margin 点差以上で勝てば condTeam 側の勝ち
          （margin=0 は「同点以上」）
   md   : 点差多択。①相手が同点以上 ②〜ちょうどN点差 ③最後は N-1 点差以上 */
function betCfg(key){
  const b = (state.bet||{})[key];
  if(!b || !b.mode) return { mode:'3way' };
  return b;
}
const mdSteps = cfg => Math.min(5, Math.max(3, Number(cfg.steps)||3));

/* スコアから当たりの選択肢を出す */
function judgeOf(key){
  const s = scoreOf(key); if(!s) return null;
  const cfg = betCfg(key);
  if(cfg.mode==='hc'){
    const condH = cfg.condTeam==='H';
    const t = condH ? s.h : s.a;
    const o = condH ? s.a : s.h;
    const mg = Number(cfg.margin)||0;
    const holds = mg===0 ? (t>=o) : (t-o >= mg);
    return holds ? cfg.condTeam : (condH ? 'A' : 'H');
  }
  if(cfg.mode==='md'){
    const n = mdSteps(cfg);
    const condH = cfg.condTeam==='H';
    const diff = condH ? (s.h-s.a) : (s.a-s.h);
    if(diff <= 0) return '1';
    if(diff >= n-1) return String(n);
    return String(diff+1);
  }
  return s.h>s.a ? 'H' : s.h<s.a ? 'A' : 'D';
}
const resultOf = judgeOf;

/* その試合で有効な選択肢の値 */
function optionValues(key){
  const cfg = betCfg(key);
  if(cfg.mode==='hc') return ['H','A'];
  if(cfg.mode==='md'){ const n=mdSteps(cfg); return Array.from({length:n},(_,i)=>String(i+1)); }
  return ['H','D','A'];
}
const validPick = (key,v) => optionValues(key).includes(v);

/* 選択肢の表示名 */
function optLabel(key, f, v, long){
  const cfg = betCfg(key);
  if(cfg.mode==='hc'){
    const mg = Number(cfg.margin)||0;
    const condClub = cfg.condTeam==='H' ? f.h : f.a;
    const othClub  = cfg.condTeam==='H' ? f.a : f.h;
    if(v===cfg.condTeam) return mg===0 ? `${jp(condClub)} 同点以上` : `${jp(condClub)} ${mg}点差以上`;
    return long ? `それ以外（${jp(othClub)} 側）` : 'それ以外';
  }
  if(cfg.mode==='md'){
    const n = mdSteps(cfg);
    const F = jp(cfg.condTeam==='H' ? f.h : f.a);
    const O = jp(cfg.condTeam==='H' ? f.a : f.h);
    const k = Number(v);
    if(k===1) return long ? `${O} 同点以上` : `${O}同点+`;
    if(k===n) return long ? `${F} ${n-1}点差以上` : `${F}${n-1}点差+`;
    return long ? `${F} ${k-1}点差ちょうど` : `${F}${k-1}点差`;
  }
  return v==='H' ? jp(f.h) : v==='A' ? jp(f.a) : 'ドロー';
}
/* 条件文（チケット上部に出す1行） */
function condText(key, f){
  const cfg = betCfg(key);
  if(cfg.mode==='hc'){
    const mg = Number(cfg.margin)||0;
    const c = jp(cfg.condTeam==='H' ? f.h : f.a);
    return mg===0 ? `ハンデ付き2択：${c} が同点以上なら成立` : `ハンデ付き2択：${c} が${mg}点差以上で勝てば成立`;
  }
  if(cfg.mode==='md'){
    const n = mdSteps(cfg);
    const F = jp(cfg.condTeam==='H' ? f.h : f.a);
    return `点差${n}択：${F} を基準にした点差を当てる`;
  }
  return null;
}
/* 選択肢に添えるエンブレム（無い場合はnull） */
function optCrestCode(key, f, v){

  if(cfg.mode==='hc') return v==='H' ? f.h : f.a;

const nomsOf = gw => (state.noms||{})['gw'+gw] || {};
function betMatches(){
  const out=[];
  Object.keys(state.noms||{}).forEach(g=>{
    const gw = +String(g).replace('gw','');
    Object.keys(state.noms[g]||{}).forEach(p=>{
      const key = state.noms[g][p];
      if(byKey[key]) out.push({ ...byKey[key], nomBy:p });
    });
  });
  return out.sort((a,b)=>a.ko-b.ko);
}
function settleMatch(key){
  const picks = (state.picks||{})[key] || {};
  const res = resultOf(key);
  const delta = {}; PLAYERS.forEach(p=>delta[p]=0);
  if(!res) return { pending:true, delta, transfers:[], winners:[], losers:[] };
  const pickers = PLAYERS.filter(p=>picks[p]);
  const winners = pickers.filter(p=>picks[p]===res);
  const losers  = pickers.filter(p=>picks[p]!==res);
  if(!winners.length || !losers.length) return { void:true, delta, transfers:[], winners, losers };
  const transfers=[];
  losers.forEach(l=>winners.forEach(w=>{ delta[l]-=STAKE; delta[w]+=STAKE; transfers.push([l,w,STAKE]); }));
  return { void:false, delta, transfers, winners, losers };
}
function sideEntries(type){
  const s = (state.side||{})[type]||{};
  return s.picks || {};
}
function actualOf(type){ return (state.actual||{})[type] || null; }
const top4Hit = (pk,ac) => Array.isArray(pk)&&Array.isArray(ac)&&pk.length===4&&ac.length===4&&pk.every((c,i)=>c===ac[i]);
const relHit  = (pk,ac) => Array.isArray(pk)&&Array.isArray(ac)&&pk.length===3&&ac.length===3&&
                            new Set(pk).size===3&&[...pk].sort().join()===[...ac].sort().join();
function settleSide(type){
  const delta={}; PLAYERS.forEach(p=>delta[p]=0);
  const ac = actualOf(type);
  const entries = sideEntries(type);
  const stake = type==='champion' ? CHAMP_STAKE : SIDE_STAKE;
  if(!ac) return { pending:true, delta, winners:[] };
  const parts = PLAYERS.filter(p=>entries[p]!=null);
  const hit = pk => type==='top4' ? top4Hit(pk,ac)
              : type==='relegation' ? relHit(pk,ac)
              : String(pk).trim().toLowerCase()===String(ac).trim().toLowerCase();
  const winners = parts.filter(p=>hit(entries[p]));
  const losers  = parts.filter(p=>!hit(entries[p]));
  if(!winners.length) return { void:true, delta, winners:[] };
  const pool = losers.length*stake;
  losers.forEach(l=>delta[l]-=stake);
  const share = Math.floor(pool/winners.length);
  let rem = pool - share*winners.length;
  winners.forEach((w,i)=>{ delta[w] += share + (i===0?rem:0); });
  return { void:false, delta, winners, stake };
}
function grandTotals(){
  const totals={}, rec={}, st={};
  PLAYERS.forEach(p=>{ totals[p]=0; rec[p]={w:0,l:0};
    st[p]={hit:0,bet:0,cur:0,best:0,curL:0,worstL:0,joined:0,elig:0}; });
  const ms = betMatches();
  ms.forEach(f=>{
    const picks=(state.picks||{})[f.key]||{};
    const locked = isLocked(f);
    if(locked){ PLAYERS.forEach(p=>{ st[p].elig++; if(picks[p]) st[p].joined++; }); }
    const r = settleMatch(f.key);
    if(r.pending) return;
    if(!r.void){
      PLAYERS.forEach(p=>{
        if(!picks[p]) return;
        st[p].bet++;
        if(r.winners.includes(p)){ st[p].hit++; st[p].cur++; st[p].curL=0; if(st[p].cur>st[p].best) st[p].best=st[p].cur; rec[p].w++; }
        else { st[p].cur=0; st[p].curL++; if(st[p].curL>st[p].worstL) st[p].worstL=st[p].curL; rec[p].l++; }
      });
    }
    PLAYERS.forEach(p=>totals[p]+=r.delta[p]);
  });
  ['champion','top4','relegation','scorer'].forEach(type=>{
    const r = settleSide(type);
    if(r.pending||r.void) return;
    PLAYERS.forEach(p=>totals[p]+=r.delta[p]);
  });
  return { totals, rec, st };
}
function gwNet(gw){
  const net={}; PLAYERS.forEach(p=>net[p]=0);
  betMatches().filter(f=>f.gw===gw).forEach(f=>{
    const r=settleMatch(f.key);
    if(r.pending||r.void) return;
    PLAYERS.forEach(p=>net[p]+=r.delta[p]);
  });
  return net;
}
function gwMvp(gw){
  const net=gwNet(gw);
  let best=-Infinity; PLAYERS.forEach(p=>{ if(net[p]>best) best=net[p]; });
  if(best<=0) return {mvp:null,tie:null,amt:best,net};
  const top=PLAYERS.filter(p=>net[p]===best);
  return top.length===1 ? {mvp:top[0],tie:null,amt:best,net} : {mvp:null,tie:top,amt:best,net};
}
function optimize(totals){
  const cred=[],debt=[];
  PLAYERS.forEach(p=>{ const v=Math.round(totals[p]||0);
    if(v>0) cred.push({p,v}); else if(v<0) debt.push({p,v:-v}); });
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const amt=Math.min(debt[i].v,cred[j].v);
    if(amt>0) tx.push([debt[i].p,cred[j].p,amt]);
    debt[i].v-=amt; cred[j].v-=amt;
    if(debt[i].v===0) i++; if(cred[j].v===0) j++;
  }
  return tx;
}
function leagueTable(){
  const T={};
  Object.keys(CLUBS).forEach(c=>T[c]={c,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  Object.keys(state.scores||{}).forEach(key=>{
    const f=byKey[key], s=scoreOf(key);
    if(!f||!s) return;
    const H=T[f.h], A=T[f.a]; if(!H||!A) return;
    H.pl++; A.pl++; H.gf+=s.h; H.ga+=s.a; A.gf+=s.a; A.ga+=s.h;
    if(s.h>s.a){ H.w++; A.l++; H.pts+=3; }
    else if(s.h<s.a){ A.w++; H.l++; A.pts+=3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  });
  return Object.values(T).map(x=>({...x,gd:x.gf-x.ga}))
    .sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf||jp(x.c).localeCompare(jp(y.c),'ja'));
}

function ticket(f, nomBy){

  const enc = (state.enc||{})[f.key] || {};

  const mine = me ? localPick(f.key, me) : null;

  const opts = optionValues(f.key);
  const cnt = {}; opts.forEach(v=>cnt[v]=0);
  let voted = 0;

    opts.map(v=>{

      const cc = optCrestCode(f.key, f, v);

      return `<button class="pk ${on?'sel':''} ${dim?'dim':''}" ${locked?'':`data-bet="${f.key}" data-side="${v}"`}>
        ${icon}<em>${esc(optLabel(f.key,f,v))}</em>${votes}</button>`;

    return `<div class="vrow"><div class="dot ${done?'':'no'}"></div>${avatar(p,20)}
      <div class="nm">${esc(p)}</div><div class="val">${esc(label)}</div></div>`;
  }).join('');

  /* 管理人の修正履歴（全員に見える・アプリからは消せへん） */

  const ovHtml = ovList.length
    ? `<div class="ovlog">⚠️ <b>管理人が修正した記録</b><br>` + ovList.map(o=>

      ).join('<br>') + `</div>`

  /* 開票後の人気メーター */

  }

      <span style="font-size:11.5px;font-weight:700;color:var(--grey)">${esc(optLabel(f.key,f,res,true))}${r.void?'・ノーゲーム':''}</span></div>`;

    extra += `<div class="scin"><span style="font-size:11px;font-weight:700">${esc(jp(f.h))}</span>
      <input type="number" min="0" inputmode="numeric" data-sh="${f.key}">

      <span style="font-size:11px;font-weight:700">${esc(jp(f.a))}</span>
      <button class="go" data-sgo="${f.key}">記帳</button></div>`;
  }

  /* 指名した本人だけ、締切前なら指名を取り消して選び直せる */
  const nomCtl = (!locked && me && nomBy && me===nomBy)
    ? `<button class="nomctl" data-nomdel="${f.key}">指名を変える</button>` : '';

  return `<div class="tk">
    <div class="tk-top"><div class="who">指名：<b>${esc(nomBy||'?')}</b></div>
      <span class="rate">${STAKE.toLocaleString()}ペリカ</span>${nomCtl}<div class="sp"></div>${dl}</div>
    ${fxLine(f)}${condLine}${picksHtml}${rows}${ovHtml}${extra}
    <div style="height:11px"></div></div>`;

const lpKey = () => ROOT+'-mypicks';
function localPick(key, who){
  try{ const m=JSON.parse(localStorage.getItem(lpKey())||'{}'); return (m[key]||{})[who]||null; }catch(e){ return null; }
}
function setLocalPick(key, who, v){
  try{
    const m=JSON.parse(localStorage.getItem(lpKey())||'{}');
    m[key]=m[key]||{};
    if(v) m[key][who]=v; else delete m[key][who];
    localStorage.setItem(lpKey(), JSON.stringify(m));
  }catch(e){}

/* 指名が取り消された試合の控えは端末からも消す（幽霊表示を防ぐ） */
function pruneLocalPicks(){
  try{
    const m = JSON.parse(localStorage.getItem(lpKey())||'{}');
    const live = new Set(betMatches().map(f=>f.key));
    let changed = false;
    Object.keys(m).forEach(k=>{
      if(!live.has(k)){ delete m[k]; changed=true; return; }
      Object.keys(m[k]||{}).forEach(w=>{
        if(!validPick(k, m[k][w])){ delete m[k][w]; changed=true; }
      });
    });
    if(changed) localStorage.setItem(lpKey(), JSON.stringify(m));
  }catch(e){}
}

/* 直近5試合の成績（新しいものが右） */
function formOf(code, n){
  const played = FIXTURES.filter(f=>(f.h===code||f.a===code) && scoreOf(f.key))
    .sort((x,y)=>x.ko-y.ko).slice(-(n||5));
  return played.map(f=>{
    const s = scoreOf(f.key);
    const gf = f.h===code ? s.h : s.a;
    const ga = f.h===code ? s.a : s.h;
    return gf>ga ? 'W' : gf<ga ? 'L' : 'D';
  });
}

      <div class="tn h">${esc(jp(f.h))}</div>${crest(f.h,20)}
      <input type="number" min="0" inputmode="numeric" data-gh="${f.key}" value="${s?s.h:''}">
      <div class="dash">−</div>
      <input type="number" min="0" inputmode="numeric" data-ga="${f.key}" value="${s?s.a:''}">
      ${crest(f.a,20)}<div class="tn">${esc(jp(f.a))}</div></div>`;

  html += `<div class="divider"></div><div class="sec"><h2>プレミアリーグ順位表</h2>
    <p>入力済みスコアから自動計算</p></div>`;

  /* Short / Full / Form の切替（公式と同じ） */
  html += `<div class="seg">
    <button data-tm="short" class="${tableMode==='short'?'on':''}">Short</button>
    <button data-tm="full"  class="${tableMode==='full'?'on':''}">Full</button>
    <button data-tm="form"  class="${tableMode==='form'?'on':''}">Form</button></div>`;

  const zone = i => `${i<4?'ucl':''} ${i>=17?'rel':''}`;
  const pos  = i => `<span class="pos">${String(i+1).padStart(2,'0')}</span>`;
  const team = x => `<span class="tm">${crest(x.c,18)}<span>${esc(jp(x.c))}</span></span>`;

  let body;
  if(tableMode==='full'){
    body = `<div class="tblscroll"><div class="tbl m-full">
      <div class="th"><span style="text-align:center">Pos</span><span>Team</span>
      <span style="text-align:center">Pl</span><span style="text-align:center">W</span>
      <span style="text-align:center">D</span><span style="text-align:center">L</span>
      <span style="text-align:center">GF</span><span style="text-align:center">GA</span>
      <span style="text-align:center">GD</span><span style="text-align:center">Pts</span></div>` +
      rows.map((x,i)=>`<div class="tr ${zone(i)}">${pos(i)}${team(x)}
        <span class="n">${x.pl}</span><span class="n">${x.w}</span>
        <span class="n">${x.d}</span><span class="n">${x.l}</span>
        <span class="n">${x.gf}</span><span class="n">${x.ga}</span>
        <span class="n">${x.gd>0?'+':''}${x.gd}</span>
        <span class="pts">${x.pts}</span></div>`).join('') + `</div></div>`;
  } else if(tableMode==='form'){
    body = `<div class="tbl m-form">
      <div class="th"><span style="text-align:center">Pos</span><span>Team</span>
      <span style="text-align:right">Form</span></div>` +
      rows.map((x,i)=>{
        const f = formOf(x.c,5);
        const pills = f.length
          ? f.map(r=>`<span class="${r}">${r}</span>`).join('')
          : `<span class="none">–</span>`;
        return `<div class="tr ${zone(i)}">${pos(i)}${team(x)}
          <span class="frm">${pills}</span></div>`;
      }).join('') + `</div>`;
  } else {
    body = `<div class="tbl m-short">
      <div class="th"><span style="text-align:center">Pos</span><span>Team</span>
      <span style="text-align:center">Pl</span><span style="text-align:center">W</span>
      <span style="text-align:center">GD</span><span style="text-align:center">Pts</span></div>` +
      rows.map((x,i)=>`<div class="tr ${zone(i)}">${pos(i)}${team(x)}
        <span class="n">${x.pl}</span><span class="n">${x.w}</span>
        <span class="n">${x.gd>0?'+':''}${x.gd}</span>
        <span class="pts">${x.pts}</span></div>`).join('') + `</div>`;
  }
  html += body;
  html += `<div class="legend"><span><i style="background:#00FF87"></i>CL出場圏</span>
    <span><i style="background:#E90052"></i>降格圏</span></div>`;
  if(tableMode==='form') html += `<div class="legend" style="padding-top:6px">
    <span>Form は直近5試合。右が最新</span></div>`;
  return html;
}

/* ── 収支タブ ── */
function viewMoney(){
  const { totals, rec, st } = grandTotals();
  const ranked = [...PLAYERS].sort((a,b)=>totals[b]-totals[a]);
  let html = `<div class="sec"><h2>収支ランキング</h2>
    <p>1試合 1,000ペリカ・年間予想も含む合計</p></div>`;
  html += `<div class="tbl">` + ranked.map((p,i)=>{
    const v=totals[p], cls=v>0?'up':v<0?'dn':'ze';
    return `<div class="mrow"><span class="rk">${i+1}</span>${avatar(p,24,true)}<span class="nm">${esc(p)}</span>
      <span class="rec">${rec[p].w}勝${rec[p].l}敗</span>
      <span class="amt ${cls}">${v>0?'+':''}${v.toLocaleString()}</span></div>`;
  }).join('') + `</div>`;

  /* 精算 */
  const tx = optimize(totals);
  html += `<div class="divider"></div><div class="sec"><h2>精算</h2>
    <p>${tx.length ? `最小 ${tx.length}回の送金で全部チャラになる` : 'いまは動かす金なし'}</p></div>`;
  if(tx.length){
    html += `<div class="tbl">` + tx.map(([f,t,a])=>
      `<div class="txrow"><span>${esc(f)}</span><span class="ar">→</span><span>${esc(t)}</span>
       <span class="am">${a.toLocaleString()}</span></div>`).join('') + `</div>`;
  }

  /* 節MVP */
  html += `<div class="divider"></div><div class="sec"><h2>節ごとMVP</h2>
    <p>その節で一番稼いだ人</p></div>`;
  let anyMvp=false, mvpHtml='';
  for(let g=1;g<=GW_MAX;g++){
    const played = betMatches().some(f=>f.gw===g && scoreOf(f.key));
    if(!played) continue;
    anyMvp=true;
    const m=gwMvp(g);
    if(m.mvp||m.tie){
      const nm = m.mvp || m.tie.join('・');
      mvpHtml += `<div class="mvp"><span class="tag">GW${g}</span>
        <span class="nm">🏆 ${esc(nm)}</span><span class="amt">+${m.amt.toLocaleString()}</span></div>`;
    } else {
      mvpHtml += `<div class="mvp none"><span class="tag">GW${g}</span>
        <span class="nm">該当者なし</span><span></span></div>`;
    }
  }
  html += anyMvp ? mvpHtml : `<div class="empty">結果が入ったらMVPが出るで</div>`;

  /* 戦績 */
  html += `<div class="divider"></div><div class="sec"><h2>戦績スタッツ</h2><p></p></div>`;
  const bet = PLAYERS.filter(p=>st[p].bet>0);
  if(bet.length){
    const hr=[...bet].sort((a,b)=>(st[b].hit/st[b].bet)-(st[a].hit/st[a].bet)||st[b].bet-st[a].bet);
    html += `<div class="stc"><div class="stc-t">🎯 的中率</div>` + hr.map((p,i)=>{
      const s=st[p], r=Math.round(s.hit/s.bet*100);
      const fire = s.cur>=2 ? `<span class="badge-s g">🔥${s.cur}連勝中</span>` : '';
      return `<div class="strow"><span class="rk">${i+1}</span><span class="nm">${esc(p)}</span>
        <span class="sub">${s.hit}/${s.bet}</span><span class="big">${r}%</span>${fire}</div>`;
    }).join('') + `</div>`;
    const bs=Math.max(0,...PLAYERS.map(p=>st[p].best));
    if(bs>=2){
      const hold=PLAYERS.filter(p=>st[p].best===bs);
      html += `<div class="stc"><div class="stc-t">⚡ 最高連勝</div>
        <div class="strow"><span class="nm">${hold.map(esc).join('、')}</span><span class="big">${bs}</span></div></div>`;
    }
    const wl=Math.max(0,...PLAYERS.map(p=>st[p].worstL));
    if(wl>=2){
      const hold=PLAYERS.filter(p=>st[p].worstL===wl);
      html += `<div class="stc"><div class="stc-t">🥶 最高連敗</div>
        <div class="strow"><span class="nm">${hold.map(esc).join('、')}</span><span class="big">${wl}</span></div></div>`;
    }
  }
  const el = PLAYERS.filter(p=>st[p].elig>0);
  if(el.length){
    const pr=[...el].sort((a,b)=>(st[b].joined/st[b].elig)-(st[a].joined/st[a].elig));
    html += `<div class="stc"><div class="stc-t">🙋 参加率</div>` + pr.map((p,i)=>{
      const s=st[p], r=Math.round(s.joined/s.elig*100);
      const bd = r===100?`<span class="badge-s g">皆勤</span>` : r<50?`<span class="badge-s r">サボり魔</span>`:'';
      return `<div class="strow"><span class="rk">${i+1}</span><span class="nm">${esc(p)}</span>
        <span class="sub">${s.joined}/${s.elig}</span><span class="big">${r}%</span>${bd}</div>`;
    }).join('') + `</div>`;
  }

  /* シーズン王者 */
  const allDone = FIXTURES.every(f=>scoreOf(f.key));
  if(allDone){
    const champ=ranked[0], s=st[champ];
    html += `<div class="divider"></div><div class="crown">
      <div class="crown-top"><div class="chev c1"></div><div class="chev c2"></div>
        <div class="in"><div class="eyebrow">2026/27 CHAMPION</div>
        <div class="big">${esc(champ)}</div>
        <div class="amt">${totals[champ]>0?'+':''}${totals[champ].toLocaleString()}ペリカ</div></div></div>
      <div class="crown-body">38節を戦い抜いた年間王者。<br>
        的中率 <b>${s.bet?Math.round(s.hit/s.bet*100):0}%</b> ／ 最高連勝 <b>${s.best}</b></div></div>`;
    html += themePlayer();
  }
  /* メンバー一覧（アイコンと注目クラブの置き場） */
  html += `<div class="divider"></div><div class="sec"><h2>メンバー</h2>
    <p>アイコンは右上の丸アイコン、注目クラブは年間予想タブから変えられる</p></div>`;
  html += `<div class="tbl">` + PLAYERS.map(p=>{
    const c = favOf(p);
    return `<div class="mrow">${avatar(p,30,true)}<span class="nm">${esc(p)}</span>
      <span class="rec">${c&&CLUBS[c] ? esc(jp(c)) : '注目クラブ未選択'}</span></div>`;
  }).join('') + `</div>`;

  html += rulesFold();
  return html;
}

function sideCard(type, title, stake, desc, n, locked, me){
  const entries = sideEntries(type);
  const enc = ((state.side||{})[type]||{}).enc || {};
  const ac = actualOf(type);
  const r = settleSide(type);
  let body = `<div class="side-b">${desc}`;

  if(locked){
    body += revealList(entries, {actual: ac, winners: r.winners, ordered: type==='top4'});
    if(ac){
      const acArr = Array.isArray(ac)?ac:[ac];
      body += `<div class="rv-actual">実際：${acArr.map((c,i)=>
        (type==='top4'?`${i+1}位 `:'')+esc(jp(c))).join(type==='top4'?' / ':'・')}<br>${
        r.void ? '誰も当てられず全員ノーゲーム' : '的中：'+r.winners.map(esc).join('・')}</div>`;
    } else {
      body += `<div class="rv-actual">結果が入ったら答え合わせされる</div>`;
    }
  } else {
    const mine = me ? localSide(type,me) : null;
    const editing = !!sideDraft[type+'_edit'];
    /* 提出済みで編集モードやないなら、選んだ中身をカードで見せる */
    if(mine && !editing){
      body += doneCard(mine, {ordered: type==='top4'});
      body += `<button class="sbtn ghost2" data-side-edit="${type}">変更する</button>`;
      body += `<div style="margin-top:7px;font-size:11px">提出済み ${Object.keys(enc).length}/${PLAYERS.length}人</div>`;
    } else {
      const draft = sideDraft[type] || mine || [];
      body += `<div class="clubgrid">` + Object.keys(CLUBS)
        .sort((a,b)=>jp(a).localeCompare(jp(b),'ja')).map(c=>{
          const idx = draft.indexOf(c);
          const num = idx>=0 && n>1 && type==='top4' ? `<span class="num">${idx+1}</span>` : '';
          const on = idx>=0 ? 'on' : '';
          return `<button class="cbtn ${on}" data-side-pick="${type}" data-c="${c}">${num}${crest(c,22)}<em>${c}</em></button>`;
        }).join('') + `</div>`;
      body += `<div style="margin-top:9px;font-weight:700;color:var(--purple)">
        選択中（${draft.length}/${n}）：${draft.length?draft.map(c=>esc(jp(c))).join(' → '):'なし'}</div>`;
      body += `<button class="sbtn" data-side-save="${type}" data-n="${n}">この内容で確定する</button>`;
      if(mine) body += `<button class="sbtn ghost2" data-side-cancel="${type}">やめる（前のままにする）</button>`;
      body += `<div style="margin-top:7px;font-size:11px">提出済み ${Object.keys(enc).length}/${PLAYERS.length}人</div>`;
    }
  }
  body += `</div>`;
  return `<div class="side"><div class="side-h"><b>${esc(title)}</b><span class="stake">${stake.toLocaleString()}</span></div>${body}</div>`;
}
function scorerCard(locked, me){
  const entries = sideEntries('scorer');
  const enc = ((state.side||{}).scorer||{}).enc || {};
  const ac = actualOf('scorer');
  const r = settleSide('scorer');
  let body = `<div class="side-b">的中した人が総取り。複数なら山分け。選手名を入れてや。`;
  if(locked){
    body += revealList(entries, {actual: ac, winners: r.winners, club:false});
    if(ac){
      body += `<div class="rv-actual">実際：${esc(ac)}<br>${
        r.void ? '誰も当てられず全員ノーゲーム' : '的中：'+r.winners.map(esc).join('・')}</div>`;
    } else {
      body += `<div class="rv-actual">結果が入ったら答え合わせされる</div>`;
    }
  } else {
    const mine = me ? localSide('scorer',me) : null;
    const editing = !!sideDraft.scorer_edit;
    if(mine && !editing){
      body += doneCard(mine, {club:false});
      body += `<button class="sbtn ghost2" data-side-edit="scorer">変更する</button>`;
      body += `<div style="margin-top:7px;font-size:11px">提出済み ${Object.keys(enc).length}/${PLAYERS.length}人</div>`;
    } else {
      const draft = (sideDraft.scorer!=null) ? sideDraft.scorer : (mine||'');
      const inList = SCORERS.some(s=>s[1]===draft);
      body += `<div class="plgrid">` + SCORERS.map(([c,n])=>
        `<button class="pbtn ${draft===n?'on':''}" data-scorer="${esc(n)}">${crest(c,18)}<em>${esc(n)}</em></button>`
      ).join('') + `</div>`;
      body += `<div style="margin-top:9px;font-weight:700;color:var(--purple)">選択中：${draft?esc(draft):'なし'}</div>`;
      body += `<input class="txtin" id="scorerIn" placeholder="リストにおらん選手はここに手入力"
        value="${(draft && !inList) ? esc(draft) : ''}">
        <button class="sbtn" id="scorerSave">この内容で確定する</button>`;
      if(mine) body += `<button class="sbtn ghost2" data-side-cancel="scorer">やめる（前のままにする）</button>`;
      body += `<div style="margin-top:7px;font-size:11px">提出済み ${Object.keys(enc).length}/${PLAYERS.length}人</div>`;
    }
  }
  body += `</div>`;
  return `<div class="side"><div class="side-h"><b>得点王</b><span class="stake">${SIDE_STAKE.toLocaleString()}</span></div>${body}</div>`;
}

/* 提出済みの中身を大きく出すカード。締切前は自分のぶんだけ、
   結果が入っとったら当たり外れも色で出す */
function doneCard(vals, opts){
  const o = opts || {};
  const ac = o.actual ? (Array.isArray(o.actual)?o.actual:[o.actual]) : null;
  const arr = Array.isArray(vals)?vals:[vals];
  const rows = arr.map((v,i)=>{
    const isClub = o.club!==false;
    const label = isClub ? jp(v) : v;
    let cls='', mk='';
    if(ac){
      /* トップ4は「順番も合っとるか」、それ以外は「含まれとるか」で判定 */
      const hit = o.ordered ? (ac[i]===v) : ac.includes(v);
      cls = hit ? 'hit' : 'miss';
      mk = hit ? `<span class="mk o">◎</span>` : `<span class="mk">✕</span>`;
    }
    return `<div class="done-row ${cls}">
      ${o.ordered?`<span class="ord">${i+1}</span>`:''}
      ${isClub?crest(v,22):''}
      <span class="nm">${esc(label)}</span>${mk}</div>`;
  }).join('');
  return `<div class="done-card">
    <div class="done-h">🔒 ${esc(o.head||'提出済み')}<div class="sp"></div>
      <span style="font-weight:600;color:var(--grey)">${esc(o.note||'あんただけ見えとる')}</span></div>
    ${rows}</div>`;
}

/* 締切後：全員ぶんを並べる */
function revealList(entries, opts){
  const o = opts || {};
  const ac = o.actual ? (Array.isArray(o.actual)?o.actual:[o.actual]) : null;
  return `<div class="rv">` + PLAYERS.map(p=>{
    const v = entries[p];
    const badge = (ac && v!=null)
      ? ((o.winners||[]).includes(p) ? `<span class="res o">的中</span>`
                                     : `<span class="res x">はずれ</span>`)
      : '';
    const head = `<div class="rv-p">${avatar(p,22)}<span>${esc(p)}</span><div class="sp"></div>${badge}</div>`;
    if(v==null) return head + `<div class="rv-none">不参加</div>`;
    const arr = Array.isArray(v)?v:[v];
    const items = arr.map((x,i)=>{
      const isClub = o.club!==false;
      let cls='';
      if(ac) cls = (o.ordered ? ac[i]===x : ac.includes(x)) ? 'hit' : 'miss';
      return `<span class="rv-item ${cls}">${o.ordered?`<span class="ord">${i+1}</span>`:''}${
        isClub?crest(x,16):''}${esc(isClub?jp(x):x)}</span>`;
    }).join('');
    return head + `<div class="rv-list">${items}</div>`;
  }).join('') + `</div>`;
}

function localSide(type, who){
  try{ const m=JSON.parse(localStorage.getItem(ROOT+'-myside')||'{}'); return (m[type]||{})[who]||null; }catch(e){ return null; }
}
function setLocalSide(type, who, v){
  try{
    const m=JSON.parse(localStorage.getItem(ROOT+'-myside')||'{}');
    m[type]=m[type]||{}; m[type][who]=v;
    localStorage.setItem(ROOT+'-myside', JSON.stringify(m));
  }catch(e){}
}

function rulesFold(){

    <b>移籍期間が締まった翌日</b>（${dateJp(SEASON_LOCK)} ${hhmm(SEASON_LOCK)} 日本時間）で一斉ロック。
    移籍が全部終わってから決められるが、そのときには第2節まで消化済みや。トップ4は<b>1〜4位を順番通り完全一致</b>、
    降格3は<b>3クラブ全的中（順不同）</b>した人だけが勝ち。的中0人なら全員ノーゲーム。
    得点王は候補リストからタップで選ぶ。おらんかったら手入力でもええ。<br><br>
    <b>注目クラブ</b>：年間予想タブの一番下で選ぶ。金は動かん、ただのキャラ付けや。
    かぶってもOKで、年間予想と同じ日にロック。<br><br>
    <b>アイコン</b>：右上の丸アイコンを押したら写真を変えられる。いつでも変更OK。
    設定したら名前の横にアイコンと、注目クラブのエンブレムが出る。<br><br>
    <b>PIN</b>：初めて自分の行を触るとき4〜8桁のPINを設定する。以降その行は本人しか触れん。

    <b>順位表</b>：入れたスコアから自動で計算される。1試合ずつ保存してもええから、

/* ══════ 操作 ══════ */
function bind(){
  /* アイコンをタップしたら大きく見れる */
  document.querySelectorAll('[data-avtap]').forEach(el=>{
    el.onclick = e=>{ e.stopPropagation(); avBig(el.dataset.avtap); };
  });
  /* テーマ曲：タップ直後に再生（await を挟まん） */
  document.querySelectorAll('[data-thbtn]').forEach(b=>{
    const on = !!(themeAudio && !themeAudio.paused);
    b.textContent = on ? '⏸ 止める' : '▶ テーマを鳴らす';
    b.classList.toggle('on', on);
    b.onclick = ()=>toggleTheme();
  });
  const fp=document.getElementById('favPick');
  if(fp) fp.onclick=()=>changeFav();
  document.querySelectorAll('[data-gw]').forEach(b=>b.onclick=()=>{
    const g=+b.dataset.gw; if(g>=1&&g<=GW_MAX){ curGw=g; render(); window.scrollTo(0,0); }
  });
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    curTab=b.dataset.tab; render(); window.scrollTo(0,0);
  });
  document.getElementById('meChip').onclick=()=>{
    const me=meNow();
    if(me){ meMenu(me); return; }
    whoAmI().then(w=>{ if(w){ toast(`${w} として認証したで`); render(); } });
  };
  document.querySelectorAll('[data-tm]').forEach(b=>b.onclick=()=>{
    tableMode=b.dataset.tm; render();
  });

  /* 指名 */
  document.querySelectorAll('[data-nom]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.nom, f=byKey[key];
    if(!f || isLocked(f)){ toast('締切済みや'); return; }
    const me=await whoAmI(); if(!me) return;
    const noms=nomsOf(f.gw);
    if(noms[me]){ toast('あんたはもうこの節で指名しとる'); return; }
    if(Object.values(noms).includes(key)){ toast('その試合はもう他の人が指名済みや'); return; }
    const cfg = await pickBetType(f);
    if(!cfg) return;
    state.bet = state.bet || {}; const prevCfg = state.bet[key];
    state.bet[key] = cfg;
    const optTxt = optionValues(key).map((v,i)=>`${i+1}. ${optLabel(key,f,v,true)}`).join('\n');
    const ctTxt = condText(key,f);
    if(prevCfg) state.bet[key]=prevCfg; else delete state.bet[key];
    if(!await ask(`${jp(f.h)} vs ${jp(f.a)} を第${f.gw}節の指名にする？\n${ctTxt?ctTxt+'\n':''}\n${optTxt}\n\n全員がこの試合に賭けられるようになる`)) return;
    db.ref().update({
      [`${ROOT}/noms/gw${f.gw}/${me}`]: key,
      [`${ROOT}/bet/${key}`]: { ...cfg, by: me }
    });
    toast('指名した。みんな賭けられるで');
  });

  /* 賭ける */
  document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.bet, side=b.dataset.side, f=byKey[key];
    if(!f || isLocked(f)){ toast('締切済み。もう変えられへん'); return; }
    const me=await whoAmI(); if(!me) return;
    const cur=localPick(key,me);
    if(cur===side){
      db.ref(`${ROOT}/enc/${key}/${me}`).remove();
      setLocalPick(key,me,null); toast('取り消した');
    }else{
      const blob=await seal(key,me,side);
      db.ref(`${ROOT}/enc/${key}/${me}`).set(blob);
      setLocalPick(key,me,side);
      toast(`賭けたで（締切まで非公開）`);
    }
    render();
  });

  /* スコア記帳（チケット内） */
  document.querySelectorAll('[data-sgo]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.sgo, f=byKey[key];
    const h=parseInt(document.querySelector(`[data-sh="${key}"]`).value,10);
    const a=parseInt(document.querySelector(`[data-sa="${key}"]`).value,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0){ toast('スコアを両方入れてや'); return; }
    const res = h>a?`${jp(f.h)} 勝ち`:h<a?`${jp(f.a)} 勝ち`:'ドロー';
    if(!await ask(`${jp(f.h)} ${h}-${a} ${jp(f.a)}\n→「${res}」で記帳する？`)) return;
    const me=await whoAmI(); if(!me) return;
    db.ref(`${ROOT}/scores/${key}`).set({h,a,by:me});
    toast('記帳した');
  });

  /* 締切後の修正（管理人） */
  document.querySelectorAll('[data-ovr]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.ovr, p=b.dataset.p, f=byKey[key];
    if(!await verifyAdmin()) return;
    const cur=((state.picks||{})[key]||{})[p]||null;
    const label = v => (v && v!=='X') ? optLabel(key, f, v, true) : '不参加';
    const next = await pickSide(f, p, cur);
    if(!next) return;
    if(next===(cur||'X')){ toast('中身が変わってへんで'); return; }
    if(!await ask(`${p} の選択を\n${label(cur)} → ${label(next)}\nに変更する？\n\n※この修正は全員に見える履歴として残る`)) return;
    const at = Date.now();
    db.ref().update({
      [`${ROOT}/picks/${key}/${p}`]: next==='X' ? null : next,
      [`${ROOT}/ovr/${key}/o${at}`]: { p, from: label(cur), to: label(next), at }
    });
    toast('修正した（履歴に残したで）');
  });

  /* 指名の取り消し（指名した本人・締切前だけ） */
  document.querySelectorAll('[data-nomdel]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.nomdel, f=byKey[key];
    if(!f || isLocked(f)){ toast('締切済み。もう変えられへん'); return; }
    const noms=nomsOf(f.gw);
    const owner=Object.keys(noms).find(p=>noms[p]===key);
    const me=await whoAmI(); if(!me) return;
    if(me!==owner){ toast('指名した本人しか変えられへんで'); return; }
    if(isLocked(f)){ toast('締切済み。もう変えられへん'); return; }
    const n = Object.keys((state.enc||{})[key]||{}).length
            + Object.keys((state.picks||{})[key]||{}).length;
    if(!await ask(`${jp(f.h)} vs ${jp(f.a)} の指名を取り消す？\n\n`+
      `入っとる投票 ${n}件は全部消える（戻せへん）\n`+
      `取り消したら、この節の別の試合をもう一回指名できる`)) return;
    await db.ref().update({
      [`${ROOT}/noms/gw${f.gw}/${me}`]: null,
      [`${ROOT}/bet/${key}`]: null,
      [`${ROOT}/enc/${key}`]: null,
      [`${ROOT}/picks/${key}`]: null,
      [`${ROOT}/ovr/${key}`]: null
    });
    PLAYERS.forEach(p=>setLocalPick(key,p,null));
    toast('指名を取り消した。下から選び直してや');
  });

  /* 順位表グリッド保存 */
  const sg=document.getElementById('saveGrid');
  if(sg) sg.onclick=async()=>{
    const fs=fxOf(curGw), updates={};
    let n=0, bad=false;
    fs.forEach(f=>{
      const he=document.querySelector(`[data-gh="${f.key}"]`);
      const ae=document.querySelector(`[data-ga="${f.key}"]`);
      const hv=he.value.trim(), av=ae.value.trim();
      if(hv===''&&av===''){ return; }
      const h=parseInt(hv,10), a=parseInt(av,10);
      if(isNaN(h)||isNaN(a)||h<0||a<0){ bad=true; return; }
      updates[`${ROOT}/scores/${f.key}`]={h,a}; n++;
    });
    if(bad){ toast('片方だけ空、みたいなんがあるで'); return; }
    if(!n){ toast('入力がないで'); return; }
    if(!await ask(`第${curGw}節の ${n}試合ぶんのスコアを保存する？\n指名された試合は賭けの精算にも反映される`)) return;
    db.ref().update(updates);
    toast(`${n}試合ぶん保存した`);
  };

  /* 年間予想：クラブ選択 */
  document.querySelectorAll('[data-side-pick]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.sidePick, c=b.dataset.c;
    const n = type==='champion'?1:type==='top4'?4:3;
    const cur = sideDraft[type] ? [...sideDraft[type]] : [];
    const i = cur.indexOf(c);
    if(i>=0) cur.splice(i,1);
    else { if(cur.length>=n){ toast(`${n}クラブまでやで`); return; } cur.push(c); }
    sideDraft[type]=cur; render();
  });
  document.querySelectorAll('[data-side-save]').forEach(b=>b.onclick=async()=>{
    const type=b.dataset.sideSave, n=+b.dataset.n;
    const draft=sideDraft[type]||[];
    if(draft.length!==n){ toast(`${n}クラブ選んでや（いま${draft.length}）`); return; }
    const me=await whoAmI(); if(!me) return;
    const label = type==='top4' ? draft.map((c,i)=>`${i+1}位 ${jp(c)}`).join('\n') : draft.map(c=>jp(c)).join('・');
    if(!await ask(`この内容で確定する？\n\n${label}\n\n${dateJp(SEASON_LOCK)} ${hhmm(SEASON_LOCK)} までは何回でも変更できる`)) return;
    const blob=await seal('side:'+type, me, JSON.stringify(draft));
    db.ref(`${ROOT}/side/${type}/enc/${me}`).set(blob);
    setLocalSide(type,me,draft);
    delete sideDraft[type];
    delete sideDraft[type+'_edit'];
    toast('提出したで（締切まで非公開）'); render();
  });
  /* 提出済みを変更する / やめる */
  document.querySelectorAll('[data-side-edit]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.sideEdit;
    sideDraft[t+'_edit']=true;
    delete sideDraft[t];        /* 前回の内容から編集を始める */
    render();
  });
  document.querySelectorAll('[data-side-cancel]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.sideCancel;
    delete sideDraft[t+'_edit'];
    delete sideDraft[t];
    toast('前のままにしたで'); render();
  });

  /* 得点王：候補リストからタップで選ぶ */
  document.querySelectorAll('[data-scorer]').forEach(b=>b.onclick=()=>{
    sideDraft.scorer = (sideDraft.scorer===b.dataset.scorer) ? '' : b.dataset.scorer;
    render();
  });


  const ss=document.getElementById('scorerSave');
  if(ss) ss.onclick=async()=>{
    const typed=(document.getElementById('scorerIn').value||'').trim().slice(0,40);
    const v = typed || (sideDraft.scorer||'').trim();
    if(!v){ toast('リストから選ぶか、手入力してや'); return; }
    const me=await whoAmI(); if(!me) return;
    if(!await ask(`得点王予想を「${v}」で確定する？`)) return;
    const blob=await seal('side:scorer', me, JSON.stringify(v));
    db.ref(`${ROOT}/side/scorer/enc/${me}`).set(blob);
    setLocalSide('scorer',me,v);
    delete sideDraft.scorer;
    delete sideDraft.scorer_edit;
    toast('提出したで'); render();
  };

  /* 実際の結果を入力（管理人） */
  const sa=document.getElementById('setActual');
  if(sa) sa.onclick=async()=>{
    if(!await verifyAdmin()) return;
    const t = await pickActualType();
    if(!t) return;
    if(t==='scorer'){
      const v = await askText('実際の得点王は？','選手名');
      if(!v) return;
      db.ref(`${ROOT}/actual/scorer`).set(v); toast('確定した'); return;
    }
    const rows = leagueTable();
    let arr;
    if(t==='champion') arr=[rows[0].c];
    else if(t==='top4') arr=rows.slice(0,4).map(x=>x.c);
    else arr=rows.slice(17,20).map(x=>x.c);
    const label = arr.map(c=>jp(c)).join(' → ');
    if(!await ask(`いまの順位表から確定する？\n\n${label}\n\n全試合のスコアが入ってから押してな`)) return;
    db.ref(`${ROOT}/actual/${t}`).set(t==='champion'?arr[0]:arr);
    toast('確定した');
  };
}
/* 指名するときに賭けの種類を決めるダイアログ */
function pickBetType(f){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg">
      <p>賭けの種類を選ぶ</p>
      <div class="sub">${esc(jp(f.h))} vs ${esc(jp(f.a))}</div>
      <select class="dsel" id="bmode">
        <option value="3way">3択（ホーム勝ち / ドロー / アウェイ勝ち）</option>
        <option value="hc">ハンデ付き2択</option>
        <option value="md">点差多択</option>
      </select>
      <div id="bsub"></div>
      <div class="bprev" id="bprev"></div>
      <div class="dlg-btns"><button class="dlg-no">やめる</button><button class="dlg-yes">これで指名</button></div>
    </div>`;
    document.body.appendChild(ov);
    const modeEl=ov.querySelector('#bmode'), sub=ov.querySelector('#bsub'), prev=ov.querySelector('#bprev');

    const teamOpts = `<option value="H">${esc(jp(f.h))}（ホーム）</option><option value="A">${esc(jp(f.a))}（アウェイ）</option>`;
    function drawSub(){
      const m=modeEl.value;
      if(m==='hc'){
        sub.innerHTML=`<select class="dsel" id="bteam">${teamOpts}</select>
          <select class="dsel" id="bmargin">
            <option value="0">同点以上で成立</option>
            <option value="1">1点差以上で成立</option>
            <option value="2" selected>2点差以上で成立</option>
            <option value="3">3点差以上で成立</option>
            <option value="4">4点差以上で成立</option>
          </select>`;
      } else if(m==='md'){
        sub.innerHTML=`<select class="dsel" id="bteam">${teamOpts}</select>
          <select class="dsel" id="bsteps">
            <option value="3">3択（同点+ / 1点差 / 2点差+）</option>
            <option value="4">4択（同点+ / 1 / 2 / 3点差+）</option>
            <option value="5">5択（同点+ / 1 / 2 / 3 / 4点差+）</option>
          </select>`;
      } else sub.innerHTML='';
      sub.querySelectorAll('select').forEach(s=>s.onchange=drawPrev);
      drawPrev();
    }
    function cfgNow(){
      const m=modeEl.value;
      if(m==='hc') return {mode:'hc',condTeam:sub.querySelector('#bteam').value,margin:Number(sub.querySelector('#bmargin').value)};
      if(m==='md') return {mode:'md',condTeam:sub.querySelector('#bteam').value,steps:Number(sub.querySelector('#bsteps').value)};
      return {mode:'3way'};
    }
    function drawPrev(){
      const cfg=cfgNow();
      const saved=(state.bet||{})[f.key];
      state.bet=state.bet||{}; state.bet[f.key]=cfg;
      const opts=optionValues(f.key).map(v=>optLabel(f.key,f,v,true));
      const ct=condText(f.key,f);
      if(saved) state.bet[f.key]=saved; else delete state.bet[f.key];
      prev.innerHTML=`${ct?`<div class="bp-cond">${esc(ct)}</div>`:''}
        <div class="bp-opts">${opts.map((o,i)=>`<span>${i+1}. ${esc(o)}</span>`).join('')}</div>`;
    }
    modeEl.onchange=drawSub;
    drawSub();
    ov.querySelector('.dlg-yes').onclick=()=>{ const c=cfgNow(); ov.remove(); res(c); };
    ov.querySelector('.dlg-no').onclick=()=>{ ov.remove(); res(null); };
    ov.onclick=e=>{ if(e.target===ov){ ov.remove(); res(null); } };
  });
}

function pickSide(f, p, cur){
  return new Promise(res=>{
    const opts = optionValues(f.key);
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg"><p>${esc(p)} の選択を変える</p>
      <div class="who-chips">
        ${opts.map(v=>`<button class="who-chip" data-s="${v}">${esc(optLabel(f.key,f,v,true))}</button>`).join('')}
        <button class="who-chip" data-s="X">不参加にする</button>
      </div><div class="dlg-btns"><button class="dlg-no">やめる</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ov.remove();res(b.dataset.s)});
    ov.querySelector('.dlg-no').onclick=()=>{ov.remove();res(null)};
    ov.onclick=e=>{ if(e.target===ov){ov.remove();res(null)} };
  });
}

      </div><div class="dlg-btns"><button class="dlg-no">やめる</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ov.remove();res(b.dataset.t)});

function askText(title, ph){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML=`<div class="dlg"><p>${esc(title)}</p>
      <input class="txtin" style="margin-top:0" placeholder="${esc(ph||'')}">
      <div class="dlg-btns"><button class="dlg-no">やめる</button><button class="dlg-yes">OK</button></div></div>`;
    document.body.appendChild(ov);
    const i=ov.querySelector('input'); setTimeout(()=>i.focus(),60);
    ov.querySelector('.dlg-yes').onclick=()=>{const v=i.value.trim();ov.remove();res(v||null)};
    ov.querySelector('.dlg-no').onclick=()=>{ov.remove();res(null)};
    ov.onclick=e=>{ if(e.target===ov){ov.remove();res(null)} };
  });
}

/* ══════ 起動 ══════ */
(function init(){
  if(!firebaseConfig.apiKey || !firebaseConfig.databaseURL){
    showErr('まだFirebaseの設定が入ってへん。<br>新しいプロジェクトを作って、ファイル冒頭の <b>firebaseConfig</b> に貼り付けてや。');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }catch(e){ showErr('Firebase設定がおかしいかも：'+esc(e.message)); return; }

  curGw = currentGwGuess();
  let seeded=false;
  db.ref(ROOT).on('value', async snap=>{
    const v = snap.val();
    if(v===null){
      if(!seeded){ seeded=true; db.ref(ROOT).set({ players:PLAYERS, created:Date.now() }); }
      return;
    }
    state = v;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    pruneLocalPicks();
    await autoReveal();
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT')) return;   /* 入力中は再描画で消さん */
    render();
  }, err=>{
    showErr('データベースに接続できへん：'+esc(err.message)+
      '<br>Realtime Databaseのルールが read/write とも true になってるか確認してや。');
  });

  /* アイコンは別ノードで購読。写真が変わったときだけ流れるから、
     賭けるたびの通信は今までと変わらん */
  db.ref(ICONS).on('value', snap=>{
    icons = snap.val() || {};
    if(state) render();
  }, ()=>{ icons = {}; });

  /* 30秒ごと。誰も触ってなくても締切が来たら自動開票させるために回しとる。
     ただし普段は数字だけ書き換えて、表示が変わる瞬間だけ画面を作り直す */
  setInterval(async()=>{
    if(!state) return;
    await autoReveal();
    const ae=document.activeElement;
    if(ae && ae.tagName==='INPUT') return;
    if(timeSig() !== lastSig) render();   /* 締切をまたいだ・キックオフした */
    else tickText();                      /* いつもはこっち */
  }, 30000);
})();
</script>
